name: Set up LLVM for druk-codegen-llvm
description: >
  Downloads (and caches) the prebuilt LLVM release matching inkwell's
  llvm22-1 feature, sets LLVM_SYS_221_PREFIX and PATH so both the build
  (llvm-sys) and the test/runtime path (druk build shelling out to llc) can
  find it, and works around the two Windows-only quirks documented in
  README.md (the missing xml2s.lib system dependency, and MSVC's own
  environment not being on PATH by default on a GitHub-hosted runner).

inputs:
  llvm-version:
    description: "LLVM release version to install, e.g. 22.1.7"
    required: true

runs:
  using: composite
  steps:
    - name: Free disk space (Linux)
      # The full LLVM release tarball ships static libs for every backend
      # (several GB uncompressed) and ubuntu-latest's default disk doesn't
      # have room for that on top of what's preinstalled.
      if: runner.os == 'Linux'
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: false

    - name: Cache LLVM
      id: cache-llvm
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/llvm
        key: llvm-${{ inputs.llvm-version }}-${{ runner.os }}

    - name: Download LLVM (Linux)
      if: runner.os == 'Linux' && steps.cache-llvm.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p "${{ runner.temp }}/llvm"
        curl -fsSL -o /tmp/llvm.tar.xz \
          "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ inputs.llvm-version }}/LLVM-${{ inputs.llvm-version }}-Linux-X64.tar.xz"
        tar -xf /tmp/llvm.tar.xz -C "${{ runner.temp }}/llvm" --strip-components=1

    - name: Download LLVM (Windows)
      # Native curl.exe/tar.exe, not Git Bash's MSYS tar: runner.temp is a
      # backslash-separated native Windows path ("D:\a\_temp"), which MSYS
      # tools misparse as an escape sequence rather than a drive letter.
      if: runner.os == 'Windows' && steps.cache-llvm.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\llvm" | Out-Null
        $archive = Join-Path $env:TEMP 'llvm.tar.xz'
        curl.exe -fsSL -o $archive `
          "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ inputs.llvm-version }}/clang+llvm-${{ inputs.llvm-version }}-x86_64-pc-windows-msvc.tar.xz"
        tar.exe -xf $archive -C "${{ runner.temp }}\llvm" --strip-components=1

    - name: Set up MSVC dev environment (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build xml2s.lib stub (Windows)
      # Some prebuilt LLVM archives list xml2s.lib as a system dependency via
      # `llvm-config --system-libs` without actually shipping it, which
      # fails the final link step with LNK1181. See README.md for the
      # background; this builds an empty stub library the linker accepts
      # instead.
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\llvm-stub-libs" | Out-Null
        Set-Location "${{ runner.temp }}\llvm-stub-libs"
        "" | Out-File -Encoding ascii empty.c
        cl.exe /c empty.c
        lib.exe /OUT:xml2s.lib empty.obj

    - name: Set LLVM environment (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo "LLVM_SYS_221_PREFIX=${{ runner.temp }}/llvm" >> "$GITHUB_ENV"
        # Native compilation (`druk build`) shells out to `llc` at run time,
        # not just at `druk-codegen-llvm` build time, so its bin/ directory
        # needs to be on PATH, not just known via the prefix env var
        # llvm-sys itself uses.
        echo "${{ runner.temp }}/llvm/bin" >> "$GITHUB_PATH"

    - name: Set LLVM environment (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "LLVM_SYS_221_PREFIX=${{ runner.temp }}\\llvm" >> "$GITHUB_ENV"
        echo "RUSTFLAGS=-L ${{ runner.temp }}\\llvm-stub-libs" >> "$GITHUB_ENV"
        echo "${{ runner.temp }}\\llvm\\bin" >> "$GITHUB_PATH"
