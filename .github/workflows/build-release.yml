name: Build Release

on:
  push:
    tags:
      - "v*"
  # Called explicitly by release.yml after pushing the tag (GITHUB_TOKEN
  # pushes don't trigger other workflows' own push triggers).
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to release, e.g. v0.2.0 (leave empty when run on a tag ref)"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  LLVM_VERSION: 22.1.7
  # Normalize to "vX.Y.Z" whether this ran from a tag push (github.ref_name
  # is already "vX.Y.Z") or a manual dispatch where the input might be
  # typed with or without the leading "v".
  RELEASE_TAG: ${{ inputs.version != '' && (startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version)) || github.ref_name }}

jobs:
  # Only two targets, matching the two platforms CI already builds and
  # tests on (ubuntu-latest, windows-latest). A third platform (macOS,
  # musl, or any cross-compiled target) is deliberately out of scope here:
  # this project links against LLVM's own prebuilt libraries, which makes
  # cross-compiling to an untested target a real risk, not a flag flip.
  # Add one only once a CI job proves the LLVM setup works there first.
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: druk-linux-x86_64
            binary: druk

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: druk-windows-x86_64
            binary: druk.exe

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}

      - name: Build
        run: cargo build --release -p druk --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Collect binaries and generate checksums
        run: |
          mkdir -p release
          cp dist/druk-linux-x86_64/druk-linux-x86_64 release/
          cp dist/druk-windows-x86_64/druk-windows-x86_64 release/druk-windows-x86_64.exe
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Build release body
        run: |
          git fetch --tags

          # Closest previous semver tag, excluding the one being released,
          # so the changelog only covers commits since the last release
          # rather than the whole repo history.
          PREV=$(git tag --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${{ env.RELEASE_TAG }}$" \
            | head -1)

          REPO="${{ github.repository }}"
          TAG="${{ env.RELEASE_TAG }}"

          cat > /tmp/release_body.md << EOF
          A Dzongkha-script compiler for Bhutan's national ICT curriculum.

          ### Install

          \`\`\`bash
          # Linux x86_64
          curl -fsSL -o druk https://github.com/${REPO}/releases/download/${TAG}/druk-linux-x86_64
          chmod +x druk && sudo mv druk /usr/local/bin/
          \`\`\`

          \`\`\`powershell
          # Windows (PowerShell)
          Invoke-WebRequest -Uri "https://github.com/${REPO}/releases/download/${TAG}/druk-windows-x86_64.exe" -OutFile druk.exe
          \`\`\`

          ### Verify checksums

          \`\`\`bash
          sha256sum -c SHA256SUMS.txt
          \`\`\`

          ### What this binary does and does not need

          This binary is self-contained: LLVM is statically linked in, so neither
          \`druk run\` (the JIT) nor \`druk build\` (ahead-of-time native
          compilation) needs LLVM or a Rust toolchain installed. \`druk build\`
          only needs the platform's own linker to create the executable: the
          Visual Studio Build Tools (C++ workload) on Windows, a C compiler such as
          \`gcc\` on Linux. Programs it builds on Windows do not need the Visual
          C++ Redistributable.

          EOF

          if [ -n "$PREV" ]; then
            gh api "repos/${REPO}/releases/generate-notes" \
              -f tag_name="${TAG}" \
              -f previous_tag_name="${PREV}" \
              --jq '.body' >> /tmp/release_body.md
          else
            echo "## What's Changed" >> /tmp/release_body.md
            echo "First release." >> /tmp/release_body.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Druk ${{ env.RELEASE_TAG }}"
          body_path: /tmp/release_body.md
          files: release/*
          fail_on_unmatched_files: true

  smoke-test:
    name: Smoke test (Linux, JIT + native)
    runs-on: ubuntu-latest
    needs: github-release

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        with:
          name: druk-linux-x86_64
          path: bin/

      - name: --version works
        run: |
          chmod +x bin/druk-linux-x86_64
          bin/druk-linux-x86_64 --version

      - name: JIT (druk run) matches the expected bundled-example output
        run: |
          output=$(bin/druk-linux-x86_64 run examples/01_hello.druk)
          echo "$output"
          echo "$output" | grep -q "Hello, Druk Lang!"

      - name: Take every Rust toolchain off PATH
        # The runner image ships one. druk build must not need it, so make a
        # silent dependency on rustc fail this job instead of passing by luck.
        run: |
          clean=""
          IFS=:
          for dir in $PATH; do
            if [ -x "$dir/rustc" ] || [ -x "$dir/cargo" ]; then continue; fi
            clean="${clean:+$clean:}$dir"
          done
          unset IFS
          echo "PATH=$clean" >> "$GITHUB_ENV"

      - name: No rustc and no LLVM are reachable
        run: |
          ! command -v rustc
          ! command -v llc

      - name: Native (druk build) produces the same output as the JIT
        # Confirms the released binary's druk build subcommand actually
        # works end to end (compile_to_object + link against
        # druk-runtime) with neither LLVM nor Rust installed, not just that
        # the binary starts.
        run: |
          jit_output=$(bin/druk-linux-x86_64 run examples/01_hello.druk)
          bin/druk-linux-x86_64 build examples/01_hello.druk -o /tmp/hello_native
          native_output=$(/tmp/hello_native)
          echo "jit: $jit_output"
          echo "native: $native_output"
          [ "$jit_output" = "$native_output" ]

  smoke-test-windows:
    name: Smoke test (Windows, JIT + native)
    runs-on: windows-latest
    needs: github-release

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        with:
          name: druk-windows-x86_64
          path: bin/

      - name: Take every Rust toolchain off PATH
        # The runner image ships one. druk build must not need it.
        shell: pwsh
        run: |
          $clean = ($env:PATH -split ';') | Where-Object {
            $_ -and -not (Test-Path (Join-Path $_ 'rustc.exe')) -and -not (Test-Path (Join-Path $_ 'cargo.exe'))
          }
          "PATH=$($clean -join ';')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: No rustc and no LLVM are reachable
        shell: pwsh
        run: |
          if (Get-Command rustc -ErrorAction SilentlyContinue) { throw 'rustc is still on PATH' }
          if (Get-Command llc -ErrorAction SilentlyContinue) { throw 'llc is on PATH' }

      - name: Native (druk build) produces the same output as the JIT
        shell: pwsh
        run: |
          Copy-Item bin/druk-windows-x86_64 druk.exe
          .\druk.exe --version
          $jit = (.\druk.exe run examples/01_hello.druk) -join "`n"
          .\druk.exe build examples/01_hello.druk -o hello_native.exe
          if ($LASTEXITCODE -ne 0) { throw 'druk build failed' }
          $native = (.\hello_native.exe) -join "`n"
          Write-Host "jit: $jit"
          Write-Host "native: $native"
          if ($jit -ne $native) { throw 'native output differs from the JIT output' }

      - name: The built program does not need the Visual C++ Redistributable
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("$PWD\hello_native.exe")
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($dll in 'VCRUNTIME140', 'api-ms-win-crt-') {
            if ($text -match [regex]::Escape($dll)) { throw "hello_native.exe imports $dll" }
          }
