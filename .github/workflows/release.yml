name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (no v prefix)"
        required: true
        type: string

jobs:
  prepare:
    name: Bump version and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # required for gh workflow run (dispatch build-release.yml)
      pull-requests: write # required for gh pr create (version bump PR)

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Bad version '${{ inputs.version }}' -- must be MAJOR.MINOR.PATCH"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Bump version in Cargo.toml
        # Every workspace member inherits version.workspace = true from
        # [workspace.package], so this one line is the single source of
        # truth for the whole workspace's version.
        run: |
          sed -i -E 's/^version = "[0-9]+\.[0-9]+\.[0-9]+"$/version = "${{ inputs.version }}"/' Cargo.toml
          grep -E '^version = "${{ inputs.version }}"' Cargo.toml || {
            echo "::error::Version replacement failed"
            exit 1
          }

      - name: Regenerate Cargo.lock
        # cargo generate-lockfile rewrites Cargo.lock to match the bumped
        # Cargo.toml. Without this, the tag's own commit would carry a
        # Cargo.lock that still names the old version.
        run: cargo generate-lockfile --offline || cargo generate-lockfile

      - name: Commit and push version bump PR branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          # No-op if the version was already bumped (re-run on the same version).
          git diff --cached --quiet || git commit -m "chore: release v${{ inputs.version }}"
          # Push to a side branch: direct pushes to main go through review
          # here too, same as every other change in this repo. The tag
          # (below) is what actually drives the release.
          git push origin HEAD:chore/bump-v${{ inputs.version }} --force

      - name: Open version bump PR
        run: |
          gh pr create \
            --title "chore: release v${{ inputs.version }}" \
            --body "Automated version bump. Merge after CI passes." \
            --base main \
            --head chore/bump-v${{ inputs.version }} \
          || echo "PR already open, skipping"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push tag
        run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Trigger build-release.yml on the tag
        # A push using the default GITHUB_TOKEN does not trigger other
        # workflows (GitHub's loop-prevention policy), so the tag push just
        # above will not fire build-release.yml's own `on: push: tags`
        # trigger. Dispatch it explicitly instead, pinned to the tag ref.
        run: |
          gh workflow run build-release.yml --ref "v${{ inputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
