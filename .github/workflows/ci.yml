name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "refactor/**", "chore/**", "docs/**", "test/**", "build/**", "ci/**"]
    paths-ignore: &doc-only-paths
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  pull_request:
    branches: ["main"]
    paths-ignore: *doc-only-paths

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  LLVM_VERSION: 22.1.7

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Free disk space (Linux)
        # The full LLVM release tarball ships static libs for every backend
        # (several GB uncompressed) and ubuntu-latest's default disk doesn't
        # have room for that on top of what's preinstalled.
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm
          key: llvm-${{ env.LLVM_VERSION }}-${{ runner.os }}

      - name: Download LLVM (Linux)
        if: runner.os == 'Linux' && steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/llvm"
          curl -fsSL -o /tmp/llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VERSION }}/LLVM-${{ env.LLVM_VERSION }}-Linux-X64.tar.xz"
          tar -xf /tmp/llvm.tar.xz -C "${{ runner.temp }}/llvm" --strip-components=1

      - name: Download LLVM (Windows)
        # Native curl.exe/tar.exe, not Git Bash's MSYS tar: runner.temp is a
        # backslash-separated native Windows path ("D:\a\_temp"), which MSYS
        # tools misparse as an escape sequence rather than a drive letter.
        if: runner.os == 'Windows' && steps.cache-llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\llvm" | Out-Null
          $archive = Join-Path $env:TEMP 'llvm.tar.xz'
          curl.exe -fsSL -o $archive `
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VERSION }}/clang+llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc.tar.xz"
          tar.exe -xf $archive -C "${{ runner.temp }}\llvm" --strip-components=1

      - name: Set up MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build xml2s.lib stub (Windows)
        # Some prebuilt LLVM archives list xml2s.lib as a system dependency
        # via `llvm-config --system-libs` without actually shipping it, which
        # fails the final link step with LNK1181. See README.md for the
        # background; this builds an empty stub library the linker accepts
        # instead.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\llvm-stub-libs" | Out-Null
          Set-Location "${{ runner.temp }}\llvm-stub-libs"
          "" | Out-File -Encoding ascii empty.c
          cl.exe /c empty.c
          lib.exe /OUT:xml2s.lib empty.obj

      - name: Set LLVM environment (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "LLVM_SYS_221_PREFIX=${{ runner.temp }}/llvm" >> "$GITHUB_ENV"
          # Native compilation (`druk build`) shells out to `llc` at test
          # time, not just at `druk-codegen-llvm` build time, so its bin/
          # directory needs to be on PATH, not just known via the prefix
          # env var llvm-sys itself uses.
          echo "${{ runner.temp }}/llvm/bin" >> "$GITHUB_PATH"

      - name: Set LLVM environment (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "LLVM_SYS_221_PREFIX=${{ runner.temp }}\\llvm" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-L ${{ runner.temp }}\\llvm-stub-libs" >> "$GITHUB_ENV"
          echo "${{ runner.temp }}\\llvm\\bin" >> "$GITHUB_PATH"

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
